<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dos martillos: calcula el mcm</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap">
<style>
:root{
  --bg:#eef2ff;--panel:#ffffff;--ink:#14204a;--muted:#5a6694;--line:#c9d2f3;--hit:#e0207a;--chip:#f2f5ff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0c1432;--panel:#16214a;--ink:#f1f4ff;--muted:#9fabd8;--line:#2b3a73;--hit:#ff3d95;--chip:#1d2a5c;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0c1432;--panel:#16214a;--ink:#f1f4ff;--muted:#9fabd8;--line:#2b3a73;--hit:#ff3d95;--chip:#1d2a5c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:500;line-height:1.3}
.app{min-height:100dvh;display:grid;grid-template-rows:auto 1fr;gap:10px;padding:10px 14px 14px;max-width:1300px;margin:0 auto}
.head{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
h1{font-size:clamp(1.15rem,2.6vw,1.6rem);font-weight:800;margin:0 8px 0 0;letter-spacing:-.02em;line-height:1.05}
.fld{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.95rem}
.fld input{width:104px;font:800 1.5rem/1 inherit;font-family:inherit;padding:7px 10px;border-radius:12px;border:3px solid var(--hit);background:var(--chip);color:var(--ink)}
button{font:800 1rem/1 inherit;font-family:inherit;cursor:pointer;border:0;border-radius:999px;padding:12px 20px;color:#fff;background:var(--hit)}
button.ghost{background:var(--chip);color:var(--ink);border:2px solid var(--line);padding:7px 12px;font-size:.9rem}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.ex{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:800;font-size:.9rem}
#stage{position:relative;overflow:hidden;background:#1a2140;border:2px solid #2b3a73;border-radius:22px;color:#f1f4ff;padding:8px 14px 10px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;gap:0 16px;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
.col+.col{border-left:2px dashed #35447f;padding-left:16px}
.work{position:relative;flex:1;min-height:150px;display:flex;align-items:center;justify-content:center}
.bench{position:absolute;left:6%;right:6%;bottom:4px;height:12px;border-radius:6px;background:#8a5a33;box-shadow:0 4px 0 #5e3c20}
.block{position:relative;z-index:1;margin-bottom:16px;min-width:1.4em;padding:.06em .3em;border-radius:.16em;background:linear-gradient(160deg,#6a7ab8,#47558c);color:#fff;font-size:min(var(--fs,5rem),13vh);font-weight:800;line-height:1.05;letter-spacing:-.03em;text-align:center;box-shadow:0 7px 0 #2d386a;font-variant-numeric:tabular-nums;transition:opacity .2s,transform .25s}
.block.shake{animation:shake .45s}
.block.gone{opacity:0;transform:scale(.2)}
@keyframes shake{20%{transform:translate(-10px,4px) rotate(-3deg)}40%{transform:translate(9px,-3px) rotate(3deg)}60%{transform:translate(-6px,2px)}100%{transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:none}}
.ham{position:absolute;z-index:4;left:calc(50% - .4em);top:0;font-size:min(5rem,10vh);line-height:1;transform-origin:85% 90%;opacity:0;pointer-events:none}
.ham.swing{animation:swing .7s ease-in forwards}
@keyframes swing{0%{opacity:1;transform:rotate(60deg) translate(60px,-30px)}55%{opacity:1;transform:rotate(60deg) translate(75px,-45px)}75%{opacity:1;transform:rotate(-30deg) translate(-90px,50px)}100%{opacity:0;transform:rotate(-30deg) translate(-90px,50px)}}
.spark{position:absolute;left:50%;top:30%;font-size:1.8rem;z-index:5;pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(300deg);opacity:0}}
.tray{display:flex;flex-wrap:wrap;gap:6px;min-height:50px;align-items:center;justify-content:center;position:relative;z-index:3}
.tile{font-size:1.5rem;font-weight:800;line-height:1;padding:7px 13px;border-radius:11px;color:#0c1432;box-shadow:0 4px 0 rgba(0,0,0,.35);opacity:0;transition:opacity .4s,filter .4s}
.tile.in{opacity:1}
.tile.in.win{outline:3px solid #fff;outline-offset:2px}
.dec{text-align:center;font-size:clamp(1.3rem,3.4vw,2.4rem);font-weight:800;min-height:1.4em;margin-top:6px;white-space:nowrap}
.dec .n{color:#cfd7ff}
.pw{display:inline-block;padding:0 7px;border-radius:9px;margin:0 1px;transition:opacity .4s,box-shadow .4s}
.pw.win{outline:3px solid #fff;outline-offset:1px;box-shadow:0 0 18px 3px rgba(255,255,255,.5)}
.pw.new{animation:pop .5s}
.bottom{grid-column:1/-1;border-top:2px dashed #35447f;margin-top:8px;padding-top:6px;text-align:center}
#msg{min-height:1.5em;font-size:clamp(.95rem,2.2vw,1.2rem);font-weight:800;color:#cfd7ff}
.eq{font-size:clamp(1.5rem,4.4vw,2.8rem);font-weight:800;line-height:1.2;min-height:1.25em;word-break:break-word}
.eq .t{display:inline-block;margin:0 2px}
.eq .t.new{animation:pop .5s}
.eq b{color:#ffe66d}
.chk{color:#aab6e6;font-weight:800;font-size:1rem;min-height:1.3em}
@media (max-width:640px){#stage{grid-template-columns:1fr}.col+.col{border-left:0;padding-left:0;border-top:2px dashed #35447f}}
@media (prefers-reduced-motion:reduce){.block.shake,.pw.new,.eq .t.new{animation:none}.ham.swing{animation-duration:.01s}.spark{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <h1>Dos martillos: ¡el mcm!</h1>
    <label class="fld">1.º<input id="na" type="number" min="2" max="99999" value="12" inputmode="numeric"></label>
    <label class="fld">2.º<input id="nb" type="number" min="2" max="99999" value="18" inputmode="numeric"></label>
    <button id="go">🔨🔨 ¡Golpe!</button>
    <button class="ghost" id="reset">↺ Reiniciar</button>
    <div class="ex"><span>Prueba:</span>
      <button class="ghost" data-n="12,18">12 y 18</button><button class="ghost" data-n="60,84">60 y 84</button>
      <button class="ghost" data-n="8,12">8 y 12</button><button class="ghost" data-n="7,13">7 y 13</button>
      <button class="ghost" data-n="45,50">45 y 50</button>
    </div>
  </header>

  <main id="stage" aria-live="polite">
    <section class="col">
      <div class="work"><div class="block" id="ba">12</div><div class="bench"></div><div class="ham" id="ha">🔨</div></div>
      <div class="tray" id="ta"></div>
      <div class="dec" id="da">&nbsp;</div>
    </section>
    <section class="col">
      <div class="work"><div class="block" id="bb">18</div><div class="bench"></div><div class="ham" id="hb">🔨</div></div>
      <div class="tray" id="tb"></div>
      <div class="dec" id="db">&nbsp;</div>
    </section>
    <div class="bottom">
      <div id="msg">Pulsa «¡Golpe!» para romper los dos números a la vez.</div>
      <div class="eq" id="eq">&nbsp;</div>
      <div class="chk" id="chk"></div>
    </div>
  </main>
</div>
<script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SUPD='⁰¹²³⁴⁵⁶⁷⁸⁹',sup=e=>e>1?String(e).split('').map(d=>SUPD[d]).join(''):'';
const col=p=>({2:'#4da3ff',3:'#ffd23f',5:'#ff6fa5',7:'#b388ff',11:'#4fd8c4',13:'#a8e063'})[p]||`hsl(${(p*47)%360} 75% 68%)`;
const fmt=n=>n.toLocaleString('es-ES');
function factors(n){const f=[];for(let d=2;d*d<=n;d++)while(n%d===0){f.push(d);n/=d}if(n>1)f.push(n);return f}
function cnt(l){const c={};l.forEach(p=>c[p]=(c[p]||0)+1);return c}
function fontFor(n){const d=String(n).length,r=[0,5.5,5.5,4.6,3.8,3.2][d]||3;return r+'rem'}
function retrig(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}
function decHTML(n,c){
  return '<span class="n">'+n+' =</span> '+Object.keys(c).map(Number).sort((a,b)=>a-b)
    .map(k=>`<span class="pw" data-p="${k}" style="color:${col(k)}">${k}${sup(c[k])}</span>`).join(' <span class="n">×</span> ');
}
let A=12,B=18,busy=false,done=false;

function reset(){
  A=parseInt($('na').value,10);B=parseInt($('nb').value,10);
  const ok=[A,B].every(x=>Number.isInteger(x)&&x>=2&&x<=99999);
  busy=false;done=false;
  ['ta','tb'].forEach(i=>$(i).innerHTML='');
  ['da','db'].forEach(i=>$(i).innerHTML='&nbsp;');
  $('eq').innerHTML='&nbsp;';$('chk').textContent='';
  [['ba',A],['bb',B]].forEach(([id,v])=>{const b=$(id);b.className='block';b.textContent=ok?v:'?';if(ok)b.style.setProperty('--fs',fontFor(v))});
  $('go').disabled=!ok;
  $('msg').textContent=ok?'Pulsa «¡Golpe!» para romper los dos números a la vez.':'Escribe dos números enteros entre 2 y 99999.';
}
function sparks(k){
  for(let i=0;i<k;i++){const s=document.createElement('span');s.className='spark';s.textContent=['💥','✨','⭐'][i%3];
    s.style.left=(15+Math.random()*70)+'%';
    s.style.setProperty('--dx',(Math.random()*300-150)+'px');s.style.setProperty('--dy',(Math.random()*200-100)+'px');
    $('stage').appendChild(s);setTimeout(()=>s.remove(),1050)}
}
async function strike(){
  if(busy||$('go').disabled)return;if(done)reset();
  busy=true;$('go').disabled=true;
  const la=factors(A),lb=factors(B),ca=cnt(la),cb=cnt(lb);
  ['ha','hb'].forEach(id=>{const h=$(id);h.classList.remove('swing');void h.offsetWidth;h.classList.add('swing')});
  await sleep(430);
  retrig($('ba'),'shake');retrig($('bb'),'shake');
  const oa=$('ba').getBoundingClientRect(),ob=$('bb').getBoundingClientRect(),r=$('stage').getBoundingClientRect();
  const mk=(list,tray,o)=>list.map(p=>{const t=document.createElement('div');t.className='tile';t.style.background=col(p);t.textContent=p;t.dataset.p=p;$(tray).appendChild(t);return {t,o}});
  const all=[...mk(la,'ta',oa),...mk(lb,'tb',ob)];
  const fin=all.map(x=>x.t.getBoundingClientRect());
  await sleep(120);
  sparks(14);$('ba').classList.add('gone');$('bb').classList.add('gone');
  all.forEach((x,i)=>{const f=fin[i],fx=f.left+f.width/2,fy=f.top+f.height/2,ox=x.o.left+x.o.width/2,oy=x.o.top+x.o.height/2;
    x.t.style.transition='none';x.t.style.transform=`translate(${ox-fx}px,${oy-fy}px) scale(.2)`});
  void $('stage').offsetWidth;
  all.forEach((x,i)=>{const f=fin[i],fx=f.left+f.width/2,fy=f.top+f.height/2;
    const sx=r.left+40+Math.random()*(r.width-80),sy=r.top+20+Math.random()*(r.height*.5);
    x.t.classList.add('in');x.t.style.transition='transform .8s cubic-bezier(.2,.9,.3,1.25),opacity .2s';x.t.style.transitionDelay=(i*22)+'ms';
    x.t.style.transform=`translate(${sx-fx}px,${sy-fy}px) rotate(${Math.random()*50-25}deg)`});
  $('msg').textContent='¡Cada número se rompe en sus primos!';
  await sleep(1400+all.length*22);
  all.forEach((x,i)=>{x.t.style.transition='transform 1s cubic-bezier(.3,1.2,.4,1),opacity .4s,filter .4s';x.t.style.transitionDelay=(i*45)+'ms';x.t.style.transform='none'});
  await sleep(1000+all.length*45);

  $('da').innerHTML=decHTML(A,ca);$('db').innerHTML=decHTML(B,cb);
  document.querySelectorAll('.pw').forEach(e=>e.classList.add('new'));
  $('msg').textContent='Esta es la descomposición de cada uno. Cada primo tiene su color.';
  await sleep(1500);

  const primes=[...new Set([...la,...lb])].sort((a,b)=>a-b);
  $('msg').textContent='Enmarcamos, de cada primo, su versión con mayor exponente.';
  $('eq').innerHTML='mcm('+A+', '+B+') = <span id="parts"></span>';
  let L=1,first=true;
  for(const p of primes){
    const ea=ca[p]||0,eb=cb[p]||0,m=Math.max(ea,eb);
    document.querySelectorAll('.pw[data-p="'+p+'"]').forEach(e=>{
      const inA=$('da').contains(e),mine=inA?ea:eb;
      e.classList.remove('new');e.classList.add(mine===m?'win':'lose')});
    document.querySelectorAll('.tile').forEach(t=>{if(+t.dataset.p!==p)return;
      const mine=t.parentNode.id==='ta'?ea:eb;
      t.classList.add(mine===m?'win':'lose')});
    const sp=document.createElement('span');
    sp.innerHTML=(first?'':' × ')+`<span class="t new" style="color:${col(p)}">${p}${sup(m)}</span>`;
    $('parts').appendChild(sp);first=false;L*=Math.pow(p,m);
    await sleep(1000);
  }
  $('msg').textContent='Multiplicamos lo que nos hemos quedado.';
  $('eq').insertAdjacentHTML('beforeend',' = <b>'+fmt(L)+'</b>');
  $('chk').textContent='Comprobación: '+fmt(L)+' ÷ '+A+' = '+fmt(L/A)+' ✔  ·  '+fmt(L)+' ÷ '+B+' = '+fmt(L/B)+' ✔';
  busy=false;done=true;$('go').disabled=false;
}
$('go').onclick=strike;
$('reset').onclick=reset;
['na','nb'].forEach(id=>{$(id).addEventListener('change',reset);$(id).addEventListener('keydown',e=>{if(e.key==='Enter'){reset();strike()}})});
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const [x,y]=b.dataset.n.split(',');$('na').value=x;$('nb').value=y;reset()});
reset();
</script>
</body>
</html>
