<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡Un martillazo! Todos los primos de golpe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap">
<style>
:root{
  --bg:#eef2ff;--panel:#ffffff;--ink:#14204a;--muted:#5a6694;--line:#c9d2f3;--hit:#e0207a;--chip:#f2f5ff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0c1432;--panel:#16214a;--ink:#f1f4ff;--muted:#9fabd8;--line:#2b3a73;--hit:#ff3d95;--chip:#1d2a5c;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0c1432;--panel:#16214a;--ink:#f1f4ff;--muted:#9fabd8;--line:#2b3a73;--hit:#ff3d95;--chip:#1d2a5c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:500;line-height:1.4}
main{max-width:1050px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:clamp(1.7rem,5vw,2.8rem);font-weight:800;margin:0 0 12px;letter-spacing:-.02em;line-height:1.05}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;font-weight:800}
.fld input{width:170px;font:800 2rem/1 inherit;font-family:inherit;padding:10px 14px;border-radius:14px;border:3px solid var(--hit);background:var(--chip);color:var(--ink)}
button{font:800 1rem/1 inherit;font-family:inherit;cursor:pointer;border:0;border-radius:999px;padding:14px 22px;color:#fff;background:var(--hit)}
button.ghost{background:var(--chip);color:var(--ink);border:2px solid var(--line);padding:11px 16px}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.ex{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center;font-weight:800}
.ex button{padding:8px 14px;font-size:.95rem}
#stage{position:relative;overflow:hidden;background:#1a2140;border-color:#2b3a73;color:#f1f4ff;padding:10px 12px 18px}
.work{position:relative;height:clamp(250px,44vw,340px);display:flex;align-items:center;justify-content:center}
.bench{position:absolute;left:8%;right:8%;bottom:8px;height:16px;border-radius:8px;background:#8a5a33;box-shadow:0 5px 0 #5e3c20}
.block{position:relative;z-index:1;margin-bottom:22px;min-width:1.4em;padding:.08em .32em;border-radius:.16em;background:linear-gradient(160deg,#6a7ab8,#47558c);color:#fff;font-size:var(--fs,8rem);font-weight:800;line-height:1.05;letter-spacing:-.03em;text-align:center;box-shadow:0 8px 0 #2d386a;font-variant-numeric:tabular-nums;transition:opacity .2s,transform .25s}
.block.shake{animation:shake .45s}
.block.pop{animation:pop .5s}
.block.gone{opacity:0;transform:scale(.2)}
.block.done{background:linear-gradient(160deg,#ffe66d,#f5b700);color:#3b2a00;box-shadow:0 8px 0 #a37400}
@keyframes shake{20%{transform:translate(-10px,4px) rotate(-3deg)}40%{transform:translate(9px,-3px) rotate(3deg)}60%{transform:translate(-6px,2px)}100%{transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:none}}
.ham{position:absolute;z-index:4;right:calc(50% - 1.8em);top:2%;font-size:clamp(3.6rem,10vw,6rem);line-height:1;transform-origin:85% 90%;opacity:0;pointer-events:none}
.ham.swing{animation:swing .7s ease-in forwards}
.ham.bounce{animation:bounce .8s ease-in forwards}
@keyframes swing{0%{opacity:1;transform:rotate(60deg) translate(70px,-40px)}55%{opacity:1;transform:rotate(60deg) translate(90px,-60px)}75%{opacity:1;transform:rotate(-30deg) translate(-110px,60px)}100%{opacity:0;transform:rotate(-30deg) translate(-110px,60px)}}
@keyframes bounce{0%{opacity:1;transform:rotate(60deg) translate(70px,-40px)}45%{opacity:1;transform:rotate(-30deg) translate(-110px,60px)}60%{opacity:1;transform:rotate(10deg) translate(-40px,0)}75%{opacity:1;transform:rotate(-30deg) translate(-110px,60px)}100%{opacity:0}}
.spark{position:absolute;left:50%;top:44%;font-size:2rem;z-index:5;pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(300deg);opacity:0}}
#msg{text-align:center;min-height:2.6em;font-size:clamp(1.05rem,2.8vw,1.4rem);font-weight:800;margin:4px 0 10px}
.cap{color:#aab6e6;font-weight:800;margin:0 0 6px}
.tray{display:flex;flex-wrap:wrap;gap:10px;min-height:76px;align-items:center;position:relative;z-index:3}
.tile{font-size:2.3rem;font-weight:800;line-height:1;padding:10px 18px;border-radius:14px;color:#0c1432;box-shadow:0 5px 0 rgba(0,0,0,.35);opacity:0}
.tile.in{opacity:1}
.deco{text-align:center}
.deco .cap{color:var(--muted)}
.eq{font-size:clamp(1.8rem,6.4vw,3.6rem);font-weight:800;line-height:1.2;min-height:1.3em;word-break:break-word}
.eq .t{display:inline-block;margin:0 2px}
.eq.big{color:var(--hit);animation:pop .6s}
.chk{margin-top:6px;color:var(--muted);font-weight:800;font-size:1.1rem;min-height:1.4em}
@media (prefers-reduced-motion:reduce){.block.shake,.block.pop,.eq.big{animation:none}.ham.swing,.ham.bounce{animation-duration:.01s}.spark{display:none}}
</style>
</head>
<body>
<main>
  <h1>¡Un martillazo y salen todos!</h1>

  <section class="panel">
    <div class="ctrl">
      <label class="fld">Escribe un número (2 a 99999)<input id="num" type="number" min="2" max="99999" value="60" inputmode="numeric"></label>
      <button id="go">🔨 ¡Golpe!</button>
      <button class="ghost" id="reset">↺ Reiniciar</button>
    </div>
    <div class="ex"><span>Prueba con:</span>
      <button class="ghost" data-n="12">12</button><button class="ghost" data-n="60">60</button><button class="ghost" data-n="84">84</button>
      <button class="ghost" data-n="97">97</button><button class="ghost" data-n="360">360</button><button class="ghost" data-n="1001">1001</button>
    </div>
  </section>

  <section class="panel" id="stage" aria-live="polite">
    <div class="work" id="work">
      <div class="block" id="block">60</div>
      <div class="bench"></div>
      <div class="ham" id="ham">🔨</div>
    </div>
    <div id="msg">Pulsa «¡Golpe!» para romper el número.</div>
    <p class="cap">Las piezas, ordenadas de menor a mayor</p>
    <div class="tray" id="tray"></div>
  </section>

  <section class="panel deco">
    <p class="cap">Descomposición factorial</p>
    <div class="eq" id="eq">&nbsp;</div>
    <div class="eq" id="eq2">&nbsp;</div>
    <div class="chk" id="chk"></div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SUPD='⁰¹²³⁴⁵⁶⁷⁸⁹',sup=e=>e>1?String(e).split('').map(d=>SUPD[d]).join(''):'';
const col=p=>({2:'#ffb347',3:'#4fd8c4',5:'#ff7eb6',7:'#b99cff',11:'#7cc0ff',13:'#a8e063'})[p]||`hsl(${(p*47)%360} 75% 68%)`;
function factors(n){const f=[];for(let d=2;d*d<=n;d++)while(n%d===0){f.push(d);n/=d}if(n>1)f.push(n);return f}
let n0=60,busy=false,done=false;

function fontFor(n){const d=String(n).length,r=[0,8,8,6.6,5.6,4.6][d]||4;return 'min('+r+'rem,'+(r*2.6)+'vw)'}
function retrig(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}
function reset(){
  n0=parseInt($('num').value,10);
  const ok=Number.isInteger(n0)&&n0>=2&&n0<=99999;
  busy=false;done=false;
  $('tray').innerHTML='';$('eq').innerHTML='&nbsp;';$('eq2').innerHTML='&nbsp;';$('eq2').classList.remove('big');$('chk').textContent='';
  const b=$('block');b.className='block';$('go').disabled=!ok;
  if(ok){b.textContent=n0;b.style.setProperty('--fs',fontFor(n0));$('msg').textContent='Pulsa «¡Golpe!» para romper el número.'}
  else{b.textContent='?';$('msg').textContent='Escribe un número entero entre 2 y 99999.'}
}
function sparks(k){
  for(let i=0;i<k;i++){const s=document.createElement('span');s.className='spark';s.textContent=['💥','✨','⭐'][i%3];
    s.style.setProperty('--dx',(Math.random()*400-200)+'px');s.style.setProperty('--dy',(Math.random()*260-170)+'px');
    $('stage').appendChild(s);setTimeout(()=>s.remove(),1050)}
}
function showEq(list){
  const cnt={};list.forEach(p=>cnt[p]=(cnt[p]||0)+1);
  const keys=Object.keys(cnt).map(Number);
  $('eq').innerHTML=n0+' = '+list.map(p=>`<span class="t" style="color:${col(p)}">${p}</span>`).join(' × ');
  if(keys.some(k=>cnt[k]>1)){
    $('eq2').innerHTML=n0+' = '+keys.map(k=>`<span class="t" style="color:${col(k)}">${k}${sup(cnt[k])}</span>`).join(' × ');
    $('eq2').classList.add('big');
  }
  $('chk').textContent='Comprobación: '+list.join(' × ')+' = '+n0+' ✔';
}
async function strike(){
  if(busy)return;if(done)reset();
  if($('go').disabled)return;
  busy=true;$('go').disabled=true;
  const list=factors(n0),prime=list.length===1,h=$('ham'),b=$('block'),tray=$('tray');
  h.classList.remove('swing','bounce');void h.offsetWidth;h.classList.add(prime?'bounce':'swing');
  await sleep(prime?340:430);
  retrig(b,'shake');
  if(prime){
    await sleep(450);sparks(10);b.classList.add('done');retrig(b,'pop');
    const t=document.createElement('div');t.className='tile in';t.style.background=col(n0);t.textContent=n0;tray.appendChild(t);
    $('msg').textContent='¡'+n0+' es primo! El martillo rebota: no se puede romper.';
    showEq(list);
  }else{
    const o=b.getBoundingClientRect(),w=$('work').getBoundingClientRect();
    const ox=o.left+o.width/2,oy=o.top+o.height/2;
    const tiles=list.map(p=>{const t=document.createElement('div');t.className='tile';t.style.background=col(p);t.textContent=p;tray.appendChild(t);return t});
    const fin=tiles.map(t=>t.getBoundingClientRect());
    await sleep(120);
    sparks(14);b.classList.add('gone');
    tiles.forEach((t,i)=>{
      const f=fin[i],fx=f.left+f.width/2,fy=f.top+f.height/2;
      t.style.transition='none';t.style.transform=`translate(${ox-fx}px,${oy-fy}px) scale(.2)`;
    });
    void tray.offsetWidth;
    tiles.forEach((t,i)=>{
      const f=fin[i],fx=f.left+f.width/2,fy=f.top+f.height/2;
      const sx=w.left+50+Math.random()*(w.width-100),sy=w.top+30+Math.random()*(w.height-110);
      t.classList.add('in');
      t.style.transition='transform .8s cubic-bezier(.2,.9,.3,1.25),opacity .2s';t.style.transitionDelay=(i*25)+'ms';
      t.style.transform=`translate(${sx-fx}px,${sy-fy}px) rotate(${Math.random()*50-25}deg)`;
    });
    $('msg').textContent='¡Salen todas las piezas de golpe!';
    await sleep(1500+list.length*25);
    $('msg').textContent='Ahora las ordenamos de menor a mayor…';
    tiles.forEach((t,i)=>{t.style.transition='transform 1s cubic-bezier(.3,1.2,.4,1)';t.style.transitionDelay=(i*70)+'ms';t.style.transform='none'});
    await sleep(1100+list.length*70);
    $('msg').textContent='Solo quedan números primos: ya no se pueden romper más.';
    showEq(list);
  }
  busy=false;done=true;$('go').disabled=false;
}
$('go').onclick=strike;
$('reset').onclick=reset;
$('num').addEventListener('change',reset);
$('num').addEventListener('keydown',e=>{if(e.key==='Enter'){reset();strike()}});
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{$('num').value=b.dataset.n;reset()});
reset();
</script>
</body>
</html>
